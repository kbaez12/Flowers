<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>For my apple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; color: #f4ecd8; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + max(28px, 6vh)); text-align: center; pointer-events: none;
    font: italic 400 clamp(22px, 6vw, 34px)/1.3 Georgia, "Times New Roman", serif; text-shadow: 0 0 18px rgba(255,220,200,.25);
    opacity: 0; animation: fadein 1.6s ease .2s forwards;
  }
  header small { display: block; margin-top: 8px; font: 10px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; color: #8a8a8a; font-style: normal; }
  #stage { position: fixed; left: 0; right: 0; top: 50%; height: min(62vh, 440px); transform: translateY(-46%); touch-action: none; cursor: grab; }
  .card {
    position: absolute; left: 50%; top: 0; width: min(68vw, 300px); height: 100%; margin-left: calc(min(68vw, 300px) / -2);
    box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 22px;
    border-radius: 18px; text-align: center; will-change: transform, opacity; transition: box-shadow .4s, border-color .4s;
  }
  .card, .card:visited { text-decoration: none; color: inherit; -webkit-touch-callout: none; }
  .card canvas { flex: 1; width: 100%; min-height: 0; display: block; image-rendering: pixelated; }
  .card h2 { margin: 6px 0 6px; font-weight: normal; }
  .card p { margin: 0; color: #9a9488; }
  .card .open { margin-top: 14px; font: 10px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .3em; color: #c9c2b2; opacity: 0; transition: opacity .4s; }
  .card.center .open { opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
  /* the flowers card: night and moonlight, like its page */
  .card.flowers { background: radial-gradient(120% 80% at 50% 30%, #12121a 0%, #050507 70%); border: 1px solid rgba(255,255,255,.12); }
  .card.flowers h2 { font: italic 400 clamp(20px, 5.4vw, 26px)/1.2 Georgia, "Times New Roman", serif; color: #f7f2ea; }
  .card.flowers p { font: italic 13px Georgia, serif; }
  .card.flowers.center { box-shadow: 0 0 40px rgba(255, 90, 90, .18), 0 0 0 1px rgba(255,255,255,.2); }
  /* the house card: pixel meadow at dusk, like its game */
  .card.house { background: linear-gradient(#1b2340 0%, #2c3a5c 46%, #3b6b3a 46.2%, #24481f 100%); border: 3px solid #f1d58b; border-radius: 8px; box-shadow: 0 5px 0 #0e1a0e; }
  .card.house h2 { font: 14px/1.6 "Press Start 2P", ui-monospace, monospace; color: #fff8e6; text-shadow: 0 2px 0 #1a1030; }
  .card.house p { font: 8px/1.8 "Press Start 2P", ui-monospace, monospace; color: #ffe3a6; }
  .card.house .open { font: 8px "Press Start 2P", monospace; letter-spacing: .15em; color: #fff8e6; }
  .card.house.center { box-shadow: 0 5px 0 #0e1a0e, 0 0 40px rgba(255, 214, 110, .22); }
  #dots { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + max(30px, 6vh)); display: flex; justify-content: center; gap: 12px; }
  #dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); background: transparent; cursor: pointer; transition: background .3s, transform .3s; }
  #dots button.on { background: #f4ecd8; transform: scale(1.25); }
  .arrow {
    position: fixed; top: 50%; transform: translateY(-50%); width: 40px; height: 64px; padding: 0; border: 0; background: none; cursor: pointer;
    color: rgba(244,236,216,.45); font: 34px Georgia, serif; z-index: 3; transition: opacity .3s;
  }
  .arrow.l { left: calc(env(safe-area-inset-left, 0px) + 2px); } .arrow.r { right: calc(env(safe-area-inset-right, 0px) + 2px); }
  .arrow.off { opacity: 0; pointer-events: none; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s ease; z-index: 9; }
  #fade.on { opacity: 1; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<header>for my apple<small>swipe &middot; tap to open</small></header>
<div id="stage">
  <a class="card flowers" href="flowers.html" data-i="0" draggable="false"><canvas id="appleIcon"></canvas><h2>Flowers at Night</h2><p>lilies under the moon</p><div class="open">tap to open</div></a>
  <a class="card house" href="house.html" data-i="1" draggable="false"><canvas id="houseIcon"></canvas><h2>Our Home</h2><p>build it together</p><div class="open">TAP TO OPEN</div></a>
</div>
<button class="arrow l" aria-label="Previous">&#8249;</button>
<button class="arrow r" aria-label="Next">&#8250;</button>
<div id="dots"></div>
<div id="fade"></div>
<script>
/* ============================================================
   A little carousel: one card per page. Swipe or use the arrows, tap the middle card to open it.
   To add another page later, add another <a class="card" href="..."> inside #stage.
   ============================================================ */
const cards = [...document.querySelectorAll('.card')];
const stage = document.getElementById('stage'), dotsEl = document.getElementById('dots'), fade = document.getElementById('fade');
const [arrL, arrR] = document.querySelectorAll('.arrow');
let idx = 0; try { idx = Math.min(cards.length - 1, +localStorage.getItem('carousel_last') || 0); } catch (_) {}
let pos = idx, drag = null, leaving = false;
cards.forEach((c, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', c.querySelector('h2').textContent); b.onclick = () => go(i); dotsEl.appendChild(b); });
const clampI = i => Math.max(0, Math.min(cards.length - 1, i));
function go(i){ idx = clampI(i); try { localStorage.setItem('carousel_last', idx); } catch (_) {} }
function layoutCards(){
  const w = cards[0].offsetWidth, gap = w * 0.92;
  cards.forEach((c, i) => {
    const d = i - pos, ad = Math.min(1.6, Math.abs(d));
    c.style.transform = `translateX(${d * gap}px) scale(${1 - ad * 0.16}) rotateY(${-d * 8}deg)`;
    c.style.opacity = String(Math.max(0, 1 - ad * 0.5));
    c.style.zIndex = String(10 - Math.round(ad * 2));
    c.classList.toggle('center', Math.abs(d) < 0.5);
  });
  [...dotsEl.children].forEach((b, i) => b.classList.toggle('on', i === idx));
  arrL.classList.toggle('off', idx === 0); arrR.classList.toggle('off', idx === cards.length - 1);
}
arrL.onclick = () => go(idx - 1); arrR.onclick = () => go(idx + 1);
window.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(idx - 1); if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'Enter') open(idx); });
function open(i){
  if (leaving) return; leaving = true;
  const c = cards[i]; c.style.transition = 'transform .6s ease'; c.style.transform += ' scale(1.08)';
  fade.classList.add('on'); setTimeout(() => { location.href = c.getAttribute('href'); }, 620);
}
// drag / swipe (taps on the middle card open it, taps on a side card bring it to the middle)
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, p: pos, moved: false }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x; if (Math.abs(dx) > 6) drag.moved = true;
  pos = drag.p - dx / (cards[0].offsetWidth * 0.92);
  pos = Math.max(-0.35, Math.min(cards.length - 0.65, pos));
});
stage.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.moved) { const dx = e.clientX - d.x; go(Math.abs(dx) > 40 ? idx + (dx < 0 ? 1 : -1) : Math.round(pos)); return; }
  const hit = cards.find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; });
  if (!hit) return; const i = +hit.dataset.i;
  if (i === idx) open(i); else go(i);
});
stage.addEventListener('pointercancel', () => { drag = null; });
stage.addEventListener('click', e => e.preventDefault());          // navigation goes through open() for the fade
window.addEventListener('pageshow', () => { leaving = false; fade.classList.remove('on'); cards.forEach(c => c.style.transition = ''); });   // coming back with the back button

/* ---------- the sky: twinkling white crosses, like the moonlit stars on the flower page ---------- */
const sky = document.getElementById('sky'), sc = sky.getContext('2d');
let SW = 0, SH = 0, DPR = 1, stars = [];
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); SW = innerWidth; SH = innerHeight;
  sky.width = SW * DPR; sky.height = SH * DPR;
  stars = Array.from({ length: Math.round(SW * SH / 5200) }, () => ({ x: Math.random() * SW, y: Math.random() * SH, s: Math.random(), ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.6 }));
  for (const c of cards) { const cv = c.querySelector('canvas'), r = cv.getBoundingClientRect(); cv.width = Math.max(1, Math.round(r.width * DPR)); cv.height = Math.max(1, Math.round(r.height * DPR)); }
}
function drawSky(t){
  sc.setTransform(DPR, 0, 0, DPR, 0, 0); sc.clearRect(0, 0, SW, SH);
  for (const s of stars) {
    const tw = 0.35 + 0.65 * Math.max(0, Math.sin(t * s.sp + s.ph)), a = (0.25 + s.s * 0.6) * tw;
    sc.fillStyle = `rgba(255,255,255,${a})`;
    if (s.s > 0.82) { const L = 2 + s.s * 3 * tw; sc.fillRect(s.x - L, s.y - 0.5, L * 2 + 1, 1); sc.fillRect(s.x, s.y - L - 0.5, 1, L * 2 + 1); }
    else sc.fillRect(s.x, s.y, 1, 1);
  }
}

/* ---------- apple icon: a red ASCII apple, bobbing (the flower page's start screen) ---------- */
const RAMP = ' .:-=+*#%@';
function appleField(x, y){                      // x, y in -1..1; returns [inside, shade 0..1, part]
  const lobe = (cx) => ((x - cx) / 0.6) ** 2 + ((y - 0.02) / 0.66) ** 2;
  const body = Math.min(lobe(-0.3), lobe(0.3), (x / 0.82) ** 2 + ((y - 0.16) / 0.72) ** 2);
  const dent = (x / 0.2) ** 2 + ((y + 0.62) / 0.2) ** 2;              // the dip at the top
  if (body < 1 && dent > 1) {
    const lx = x + 0.38, ly = y + 0.28, light = Math.max(0, 1 - Math.sqrt(lx * lx + ly * ly) * 0.85);
    return [true, Math.min(1, 0.25 + light * 0.75 + (1 - body) * 0.15), 'body'];
  }
  if (Math.abs(x - 0.02 + (y + 0.6) * 0.3) < 0.028 && y < -0.48 && y > -0.95) return [true, 0.6, 'stem'];
  const lu = x - 0.08, lv = y + 0.8, ra = lu * 0.87 + lv * 0.5, rb = -lu * 0.5 + lv * 0.87;   // leaf, tilted up
  const lf = ((ra - 0.24) / 0.25) ** 2 + (rb / 0.1) ** 2;
  if (lf < 1 && x > 0.04) return [true, 0.75 - lf * 0.3, 'leaf'];
  return [false, 0, ''];
}
function drawAppleIcon(t){
  const cv = document.getElementById('appleIcon'), c = cv.getContext('2d'), w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h);
  const cols = 46, cell = w / cols, rows = Math.floor(h / (cell * 1.35));
  c.font = `bold ${Math.round(cell * 1.3)}px ui-monospace, Menlo, Consolas, monospace`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const bob = Math.sin(t * 1.6) * 0.06, R = 0.78;
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const px = (q + 0.5) * (w / cols), py = (r + 0.5) * (h / rows);
    const x = ((px - w / 2) / (Math.min(w, h * 0.8) * 0.5)) / R, y = ((py - h * 0.5) / (Math.min(w, h * 0.8) * 0.5)) / R - bob;
    const [inside, sh, part] = appleField(x, y);
    if (!inside) continue;
    const k = Math.max(1, Math.min(9, Math.round(sh * 9)));
    if (part === 'body') { const l = 30 + sh * 34; c.fillStyle = `hsl(${356 + sh * 6}, ${78 + sh * 10}%, ${l}%)`; }
    else if (part === 'stem') c.fillStyle = '#8a5a34';
    else c.fillStyle = `hsl(110, 55%, ${30 + sh * 25}%)`;
    c.fillText(part === 'stem' ? '|' : RAMP[k], px, py);
  }
  // soft shadow on the floor, smaller when the apple is up
  const sw = w * 0.22 * (1 - bob * 1.5);
  c.fillStyle = 'rgba(255,255,255,0.06)'; c.beginPath(); c.ellipse(w / 2, h * 0.93, sw, sw * 0.14, 0, 0, 6.29); c.fill();
}

/* ---------- house icon: the little white ranch house from the game, at dusk, windows glowing ---------- */
function drawHouseIcon(t){
  const cv = document.getElementById('houseIcon'), c = cv.getContext('2d'), w = cv.width, h = cv.height;
  c.clearRect(0, 0, w, h); c.imageSmoothingEnabled = false;
  const AW = 64, AH = 50, u = Math.max(1, Math.floor(Math.min(w / AW, h / AH))), ox = Math.round((w - AW * u) / 2), oy = Math.round(h - AH * u - h * 0.02);
  const P = (col, x, y, ww = 1, hh = 1) => { c.fillStyle = col; c.fillRect(ox + Math.round(x * u), oy + Math.round(y * u), Math.ceil(ww * u), Math.ceil(hh * u)); };
  const base = 42, cx = 32, x0 = 9, wt = base - 13;
  // moon and a few pixel stars
  P('#fff4c8', 52, 4, 4, 4); P('#fff4c8', 51, 5, 1, 2); P('#1b2340', 54, 4, 2, 2);
  for (const [sx, sy, ph] of [[6, 6, 0], [16, 3, 1.3], [40, 8, 2.1], [27, 2, 3.4], [60, 14, 4.2]]) if (Math.sin(t * 2 + ph) > -0.3) P('#ffffff', sx, sy);
  // ground, driveway
  P('#3f7a3a', 0, base + 1, AW, 7); P('#4f8f44', 0, base + 1, AW, 1);
  for (let i = 0; i < 7; i++) P('#d9d2c0', cx - 3 - Math.round(Math.sin(i * 0.4) * 2) , base + 2 + i, 6, 1);
  // apple trees on both sides
  for (const [tx, ty] of [[4, base + 1], [59, base + 1]]) {
    P('#6b4a2d', tx, ty - 6, 1, 6);
    for (let yy = -5; yy <= 4; yy++) for (let xx = -5; xx <= 5; xx++) if (xx * xx + yy * yy * 1.2 < 24) P((xx + yy) > 2 ? '#2f6e32' : ((xx + yy) < -3 ? '#7cba52' : '#4b9442'), tx + xx, ty - 11 + yy);
    for (const [ax, ay] of [[-2, -13], [2, -11], [-3, -9], [1, -15], [3, -8]]) P('#e0362c', tx + ax, ty + ay);
  }
  // house: stone base, white walls, windows, door
  P('#bdb4a0', x0 - 1, base, 48, 2);
  P('#f3f0e8', x0, wt, 46, 13); P('#dedad0', x0 + 13, wt, 6, 10); P('#dedad0', x0 + 27, wt, 6, 10); P('#d3cab6', x0, base - 3, 46, 3);
  const glow = 0.75 + 0.25 * Math.sin(t * 2.2);
  const win = (wx, ww) => { P('#17181c', wx, base - 10, ww, 6); P(`rgba(255,214,110,${glow})`, wx + 1, base - 9, ww - 2, 4); P('#17181c', wx + (ww >> 1), base - 10, 1, 6); };
  win(x0 + 3, 7); win(x0 + 14, 5); win(x0 + 28, 5); win(x0 + 36, 7);
  P('#17181c', cx - 3, base - 9, 6, 9); P('#ffd56e', cx - 2, base - 8, 1, 4); P('#ffd56e', cx + 1, base - 8, 1, 4); P('#d9b45a', cx, base - 4);
  P('#e3dccb', cx - 4, base + 1, 8, 1);
  // charcoal roof with three gables
  for (let y = 0; y < 11; y++) { const half = Math.round(10 + y * 1.4); P(y % 2 ? '#2f3037' : '#3b3c45', cx - half, wt - 11 + y, half * 2, 1); }
  P('#1d1e24', cx - 25, wt - 1, 50, 1);
  const gable = (gx, gw, gh) => { const mid = gx + gw / 2; for (let y = 0; y <= gh; y++) { const half = Math.round((gw / 2 + 1) * y / gh); P('#f3f0e8', mid - half, wt - gh + y, half * 2, 1); P('#1d1e24', mid - half - 1, wt - gh + y, 1, 1); P('#1d1e24', mid + half, wt - gh + y, 1, 1); } P('#17181c', Math.round(mid) - 1, wt - Math.round(gh * 0.55), 1, 2); };
  gable(x0 - 1, 14, 9); gable(x0 + 33, 14, 9); gable(cx - 5, 10, 12);
  // chimney + smoke
  P('#e9e6de', cx + 8, wt - 16, 3, 6); P('#17181c', cx + 7, wt - 17, 5, 1);
  for (let i = 0; i < 3; i++) { const k = ((t * 0.5 + i / 3) % 1); c.globalAlpha = 0.5 * (1 - k); P('#e8e8e8', cx + 9 + Math.sin(k * 6 + i) * 1.5, wt - 19 - k * 9, 2, 2); c.globalAlpha = 1; }
  // porch lanterns
  P('#17181c', cx - 6, base - 9, 1, 3); P('#fff0a8', cx - 6, base - 8); P('#17181c', cx + 5, base - 9, 1, 3); P('#fff0a8', cx + 5, base - 8);
  // a little heart floating up from the door now and then
  const hk = (t * 0.45) % 1; if (hk < 0.6) { c.globalAlpha = 1 - hk / 0.6; const hy = base - 12 - hk * 14; P('#ff5d7a', cx - 2, hy, 2, 1); P('#ff5d7a', cx + 1, hy, 2, 1); P('#ff5d7a', cx - 2, hy + 1, 5, 1); P('#ff5d7a', cx - 1, hy + 2, 3, 1); P('#ff5d7a', cx, hy + 3, 1, 1); c.globalAlpha = 1; }
}

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const t = now / 1000;
  if (!drag) { const target = idx; pos += (target - pos) * Math.min(1, (now - (last || now)) / 1000 * 9); if (Math.abs(target - pos) < 0.001) pos = target; }
  last = now;
  layoutCards(); drawSky(t); drawAppleIcon(t); drawHouseIcon(t);
}
window.addEventListener('resize', resize);
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
