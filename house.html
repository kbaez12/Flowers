<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#62b84a">
<title>Our Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1d3a1f; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: pointer; }
  .pix { font-family: "Press Start 2P", ui-monospace, Menlo, monospace; }
  #banner {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%);
    width: min(92vw, 520px); box-sizing: border-box; padding: 10px 12px; text-align: center;
    color: #fff8e6; font-size: clamp(8px, 2.5vw, 12px); line-height: 1.7;
    background: rgba(28, 40, 26, 0.82); border: 3px solid #f1d58b; border-radius: 4px;
    box-shadow: 0 3px 0 #0e1a0e; pointer-events: none; transition: opacity .4s;
  }
  #banner b { color: #ffd76a; font-weight: normal; }
  #bubble {
    position: fixed; padding: 6px 8px; font-size: 8px; line-height: 1.6; color: #2a1d14; background: #fffaf0;
    border: 2px solid #2a1d14; border-radius: 3px; pointer-events: none; white-space: nowrap;
    transform: translate(-50%, -100%); opacity: 0; transition: opacity .25s;
  }
  #bubble:after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -5px; border: 5px solid transparent; border-top-color: #2a1d14; border-bottom: 0; }
  #end {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14vh); gap: 16px; box-sizing: border-box; pointer-events: none; opacity: 0; transition: opacity 1.6s;
    color: #fff3d6; text-align: center; text-shadow: 0 2px 0 #1a1030, 0 0 14px rgba(255,215,120,.5);
  }
  #end.show { opacity: 1; }
  #end.show #again { pointer-events: auto; }   /* only tappable once the ending is showing */
  #end h1 { margin: 0; font-size: clamp(16px, 5.2vw, 28px); font-weight: normal; }
  #end p { margin: 0; font-size: clamp(8px, 2.6vw, 12px); line-height: 1.8; color: #ffe3a6; }
  #card {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(10, 18, 10, 0.55); opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #card.show { opacity: 1; pointer-events: auto; }
  #card .paper {
    width: min(84vw, 340px); box-sizing: border-box; padding: 22px 18px 16px; text-align: center;
    background: #fff8e6; color: #2a1d14; border: 4px solid #2a1d14; border-radius: 4px; box-shadow: 0 5px 0 #2a1d14;
    transform: scale(.85); transition: transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  #card.show .paper { transform: scale(1); }
  #card .pic { display: none; width: 96px; height: 60px; margin: 0 auto 12px; image-rendering: pixelated; }
  #card.fish .pic { display: block; }
  #meter {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 22px); top: 50%; transform: translateY(-50%) scale(.8);
    display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s;
  }
  #meter.show { opacity: 1; transform: translateY(-50%) scale(1); }
  #meter .bar { position: relative; width: 22px; height: 190px; background: linear-gradient(#e84a3c, #b8262a); border: 3px solid #2a1d14; border-radius: 3px; box-shadow: 0 3px 0 #2a1d14; }
  #meter .zone { position: absolute; left: 0; right: 0; top: 41%; height: 18%; background: #4fd06a; border-top: 2px solid #9ff0a8; border-bottom: 2px solid #2a8a3a; }
  #meter .mark { position: absolute; left: -8px; width: 32px; height: 6px; margin-top: -3px; background: #fff8e6; border: 2px solid #2a1d14; border-radius: 2px; }
  #meter .hint { font-size: 9px; color: #fff8e6; padding: 5px 7px; background: rgba(28,40,26,.85); border: 2px solid #f1d58b; border-radius: 3px; }
  #card .from { font-size: 8px; color: #b0405a; letter-spacing: .1em; margin-bottom: 14px; }
  #card .msg { font-size: clamp(10px, 3.2vw, 13px); line-height: 2; }
  #card .hearts { margin: 14px 0 12px; color: #ff5d7a; font-size: 12px; letter-spacing: 6px; }
  #card button { font-size: 9px; padding: 9px 14px; color: #2a1d14; background: #ffd76a; border: 3px solid #2a1d14; border-radius: 3px; box-shadow: 0 3px 0 #2a1d14; cursor: pointer; }
  #found {
    position: fixed; left: calc(env(safe-area-inset-left, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    padding: 7px 9px; font-size: 8px; color: #fff8e6; background: rgba(28,40,26,.8); border: 2px solid #f1d58b; border-radius: 3px;
    pointer-events: none; opacity: 0; transition: opacity .4s;
  }
  #found.show { opacity: 1; }
  #mute {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 10px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    width: 34px; height: 34px; padding: 0; font-size: 14px; color: #fff8e6; background: rgba(28,40,26,.8);
    border: 2px solid #f1d58b; border-radius: 3px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  #mute.show { opacity: 1; pointer-events: auto; }
  #back {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 52px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    width: 34px; height: 34px; box-sizing: border-box; font-size: 12px; line-height: 30px; text-align: center; text-decoration: none;
    color: #fff8e6; background: rgba(28,40,26,.8); border: 2px solid #f1d58b; border-radius: 3px;
  }
  #mute.off { color: #7d8a74; text-decoration: line-through; }
  #again {
    margin-top: 10px; pointer-events: none; font-size: 10px; padding: 10px 14px; color: #2a1d14; background: #ffd76a;
    border: 3px solid #2a1d14; border-radius: 3px; box-shadow: 0 3px 0 #2a1d14; cursor: pointer;
  }
  #rhythm {
    position: fixed; left: 50%; width: min(94vw, 420px); height: min(58vh, 470px); transform: translateX(-50%) translateY(12px);
    display: flex; flex-direction: column; box-sizing: border-box; padding: 8px 8px 10px; gap: 6px;
    background: rgba(18, 26, 18, 0.62); border: 3px solid #f1d58b; border-radius: 6px; box-shadow: 0 4px 0 rgba(14,26,14,.8);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; touch-action: none;
  }
  #rhythm.bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 52px); }   /* clear of the mute button */
  #rhythm.top { top: calc(env(safe-area-inset-top, 0px) + 10px); }
  #rhythm.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #rhythm .bar { display: flex; align-items: center; justify-content: space-between; color: #fff8e6; font-size: 9px; min-height: 22px; }
  #rhythm .score b { color: #ffd76a; font-weight: normal; }
  #rhythm .judge { color: #9ff0a8; font-size: 9px; }
  #rhythm .quit { font-size: 9px; padding: 5px 7px; color: #2a1d14; background: #ffd76a; border: 2px solid #2a1d14; border-radius: 3px; cursor: pointer; }
  #rhythm canvas { position: static; width: 100%; height: auto; flex: 1; min-height: 0; image-rendering: pixelated; touch-action: none; cursor: default; }
  #rhythm .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #rhythm .pads button {
    height: 58px; padding: 0; border: 3px solid #2a1d14; border-radius: 6px; cursor: pointer; touch-action: none;
    background: #fff8e6 center / 40px 40px no-repeat; image-rendering: pixelated; box-shadow: 0 4px 0 #2a1d14; transition: transform .06s;
  }
  #rhythm .pads button.on { transform: translateY(3px); box-shadow: 0 1px 0 #2a1d14; filter: brightness(1.15); }
  #rhythm .result {
    position: absolute; inset: 40px 14px 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; color: #fff8e6; font-size: 11px; line-height: 1.8; background: rgba(18, 26, 18, 0.85); border: 3px solid #f1d58b; border-radius: 4px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #rhythm .result.show { opacity: 1; }
  #rhythm .result b { color: #ffd76a; font-weight: normal; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner" class="pix"></div>
<div id="bubble" class="pix"></div>
<div id="card" class="pix"><div class="paper"><div class="from">A LITTLE SURPRISE</div><img class="pic" alt=""><div class="msg"></div><div class="hearts">&#9829; &#9829; &#9829;</div><button class="pix">close</button></div></div>
<div id="found" class="pix"></div>
<div id="meter" class="pix"><div class="bar"><div class="zone"></div><div class="mark"></div></div><div class="hint">TAP!</div></div>
<div id="rhythm" class="pix bottom"><div class="bar"><span class="score">&#9829; <b>0</b></span><span class="judge"></span><button class="quit pix">stop</button></div><canvas></canvas><div class="pads"><button data-l="0" aria-label="red"></button><button data-l="1" aria-label="green"></button><button data-l="2" aria-label="gold"></button><button data-l="3" aria-label="pink"></button></div><div class="result"></div></div>
<a id="back" class="pix" href="index.html" aria-label="Back to the start">&lt;</a>
<button id="mute" class="pix" aria-label="Mute">&#9835;</button>
<div id="end" class="pix"><h1>Our home</h1><p>built together,<br>one piece at a time</p><button id="again" class="pix">build again</button></div>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  endTitle: "Our home",
  endLine: "built together,<br>one piece at a time",
  walkSpeed: 40,        // pixels per second (in the small pixel world)
  sound: true,          // pixel sound effects
  music: "vals.mp3",    // background song, loops ("" = none)
  musicVolume: 0.35,
  danceSong: "porti.mp3",   // the song for the dance rhythm game
  danceVolume: 0.8,
  // hidden surprises around the ranch: one message each (edit freely)
  surprises: [
    "Hello my apple, hope you have a good day!",
    "You found it! Just a reminder that I'm so proud of you, my apple.",
    "If you're reading this, I'm probably thinking about you right now.",
    "Every home needs a heart. Ours is you, my apple.",
    "Thank you for being you. I love you, apple.",
    "Hi apple! Drink some water and take a breath. You're doing amazing.",
    "Look how much you've built today. Proud of you!",
    "Small steps still count. Keep going, apple.",
    "You found them all! You're kind of unstoppable, apple.",
  ],
  // fishing: one of these with every fish she catches, in order
  fishMessages: [
    "Hi apple! Hope today is good to you.",
    "You caught it! Just a reminder that you're doing great.",
    "Whatever today brings, you've got this, apple.",
    "This place feels like home because you're in it.",
    "Thanks for being you. You make every day better.",
  ],
  treatEvery: 14,       // seconds between an apple or carrot appearing in the meadow
};

/* ============================================================
   Pixel world size: a small canvas scaled up with crisp pixels
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const lo = document.createElement('canvas'), g = lo.getContext('2d');   // the pixel world
const bg = document.createElement('canvas'), bgc = bg.getContext('2d');  // static meadow, drawn once
let W, H, dpr, IW = 180, IH = 320, SCALE = 2;

function rnd(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
function px(c, x, y, w = 1, h = 1){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }

/* ============================================================
   Characters (12 x 20 pixel sprites)
   ============================================================ */
/* Chibi style: big head, black outline, dot eyes. 16 x 22 chunky pixels each. */
const HER_PAL = { O:'#0b0b0d', H:'#231815', h:'#4a342a', S:'#b98058', E:'#140c09', C:'#e58f86', L:'#94464a', B:'#2b2b33', P:'#f6f2e6', N:'#2b2b33', F:'#111114' };
const HIM_PAL = { O:'#0b0b0d', H:'#17110f', h:'#3d2c24', S:'#b07a52', D:'#b07a52', E:'#140c09', L:'#8a4a3c', K:'#b07a52', T:'#26262d', t:'#3a3a45', B:'#111114', J:'#2a2d38', F:'#f0f0f0' };
const HER_DOWN = [
  "....OOOOOOOO....","...OHHHHHHHHO...","..OHHHHhHHHHHO..",".OHHHHHHHHHHHHO.",".OHHHHHHSSHHHHO.",".OHHHSSSSSSSHHO.",
  ".OHHSSSSSSSSHHO.",".OHHSESSSSESHHO.",".OHHSESSSSESHHO.",".OHHCCSSSSCCHHO.",".OHHSSSLLSSSHHO.",".OHHHSSSSSSHHHO.",
  ".OHHHOOSSOOHHHO.",".OHHOBPBPBPBOHO.",".OHOBBBBBBBBOHO.",".OOSBBBBBBBBSOO.","...OBBBBBBBBO...","....OBBBBBBO...."];
const HIM_DOWN = [
  "...OO.OOOO.OO...","..OHHOHHHHOHHO..",".OHHHHHhHHHHHHO.",".OHHhHHHHHHhHHO.",".OHHHHHHHHHHHHO.",".OHSHHSSSHHHSHO.",
  ".OSSSSSSSSSSSSO.",".OSSDDSSSSDDSSO.",".OKSSESSSSESSKO.",".OSSSESSSSESSSO.",".OSSSSSLLSSSSSO.","..OSSSSSSSSSSO..",
  "...OOOSSSSOOO...","..OTTTtBBtTTTO..",".OTTTTTBBTTTTTO.",".OTTTTTtBTTTTTO.",".OSOTTTtTTTTOSO.","...OOTTTTTTOO..."];
const withRows = (base, rows) => { const o = base.slice(); for (const k in rows) o[k] = rows[k]; return o; };
const SPR = {
  her: {
    down: HER_DOWN,
    side: withRows(HER_DOWN, { 4:".OHHHHHHHHSSHHO.", 5:".OHHHHHSSSSSSHO.", 6:".OHHHHHSSSSSSSO.", 7:".OHHHHHSSESSESO.", 8:".OHHHHHSSESSESO.", 9:".OHHHHHSSSSCCSO.", 10:".OHHHHHSSSSLLSO.", 11:".OHHHHHHSSSSSHO." }),
    up: withRows(HER_DOWN, { 4:".OHHHHHHHHHHHHO.", 5:".OHHHHHHHHHHHHO.", 6:".OHHHHhHHHHHHHO.", 7:".OHHHHHHHHHHHHO.", 8:".OHHHHHHHHHHHHO.", 9:".OHHHHHHHHHHHHO.", 10:".OHHHHHHHHHHHHO.", 11:".OHHHHHHHHHHHHO.", 12:".OHHHHHHHHHHHHO.", 13:".OHHHHHHHHHHHHO.", 14:".OBHHHHHHHHHHBO.", 15:".OOSBHHHHHHBSOO." }),
  },
  him: {
    down: HIM_DOWN,
    side: withRows(HIM_DOWN, { 5:".OHHHHHSSHHHSHO.", 6:".OHHHSSSSSSSSSO.", 7:".OHHHSSSDDSSDDO.", 8:".OHKSSSSESSSESO.", 9:".OHHSSSSESSSESO.", 10:".OHSSSSSSSLLSSO." }),
    up: withRows(HIM_DOWN, { 5:".OHHHHHHHHHHHHO.", 6:".OHHHHHHHHHHHHO.", 7:".OHHHHHHHHHHHHO.", 8:".OKSHHHHHHHHSKO.", 9:".OSSSHHHHHHSSSO.", 10:".OSSSSSSSSSSSSO.", 13:"..OTTTttttTTTO..", 14:".OTTTTTTTTTTTTO.", 15:".OTTTTTTTTTTTTO." }),
  },
};
// leg poses (4 rows under the body): standing, step A, step B. L = trousers, F = shoes
const LEGS = [
  ["....OLLOOLLO....","....OLLOOLLO....","....OFFOOFFO....","....OOO..OOO...."],
  ["....OLLOOLLO....","....OLLOOFFO....","....OFFO.OOO....","....OOO........."],
  ["....OLLOOLLO....","....OFFOOLLO....","....OOO.OFFO....",".........OOO...."],
];
const SW = 16, SH = 22;
const sprites = {};      // pre-rendered little canvases
function buildSprites(){
  for (const who of ['her', 'him']) {
    const pal = who === 'her' ? HER_PAL : HIM_PAL, leg = who === 'her' ? 'N' : 'J';
    for (const dir of ['down', 'up', 'side']) {
      for (let f = 0; f < 3; f++) {
        const rows = SPR[who][dir].concat(LEGS[f].map(l => l.replace(/L/g, leg)));
        const c = document.createElement('canvas'); c.width = SW; c.height = SH;
        const cc = c.getContext('2d');
        rows.forEach((row, y) => [...row.padEnd(SW, '.').slice(0, SW)].forEach((ch, x) => {
          if (ch !== '.' && pal[ch]) { cc.fillStyle = pal[ch]; cc.fillRect(x, y, 1, 1); }
        }));
        sprites[`${who}_${dir}_${f}`] = c;
      }
    }
  }
}
buildSprites();

/* ============================================================
   Animals: two horses, two highland cows, a baby pig. They wander the meadow
   and never walk behind (or through) the house, so they are always visible.
   ============================================================ */
function animalSprite(w, h, outline, paint){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cc = c.getContext('2d');
  paint((col, x, y, ww = 1, hh = 1) => { cc.fillStyle = col; cc.fillRect(x, y, ww, hh); });
  const im = cc.getImageData(0, 0, w, h), d = im.data, solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
  const edge = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) edge.push([x, y]);
  cc.fillStyle = outline; edge.forEach(([x, y]) => cc.fillRect(x, y, 1, 1));
  return c;
}
function legs(P, xs, top, len, col, hoof, f){        // f: 0 stand, 1 / 2 walking
  const lw = len <= 2 ? 1 : 2;
  xs.forEach((x, i) => {
    const lift = f && ((i % 2) === (f - 1)) ? 1 : 0, dx = lift ? 1 : 0;
    P(col, x + dx, top, lw, len - lift); P(hoof, x + dx, top + len - lift - 1, lw, 1);
  });
}
/* ---------- Horses and highland cows: soft shaded farm-sprite style ----------
   Drawn with pixels half the size of the characters', outlined in each animal's own darkest tone,
   with side, front and back views and a 6-frame walk (legs move in diagonal pairs, body bobs, head nods). */
function sprCanvas(w, h, outline, paint){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cc = c.getContext('2d');
  paint((col, x, y, ww = 1, hh = 1) => { if (!col) return; cc.fillStyle = col; cc.fillRect(Math.round(x), Math.round(y), ww, hh); });
  const im = cc.getImageData(0, 0, w, h), d = im.data, solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
  const edge = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) edge.push([x, y]);
  cc.fillStyle = outline; edge.forEach(([x, y]) => cc.fillRect(x, y, 1, 1));
  return c;
}
const hashN = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function tone(pal, k, x, y, rough = 0.25){        // k: -1 = top (lit) .. 1 = underside (shade)
  const v = k + (hashN(x, y) - 0.5) * rough;
  return v < -0.6 ? pal.h : v < -0.15 ? pal.l : v < 0.4 ? pal.m : pal.d;
}
function blobS(P, cx, cy, rx, ry, pw, fn){
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
    const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
    if (Math.abs(nx) ** pw + Math.abs(ny) ** pw <= 1) P(fn(nx, ny, x, y), x, y);
  }
}
function strokeS(P, pts, w0, w1, fn){             // tapering thick polyline; fn(u along, n across, x, y)
  const seg = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); total += l; }
  const n = Math.max(2, Math.ceil(total * 2));
  for (let s = 0; s <= n; s++) {
    let d = s / n * total, i = 0; while (i < seg.length - 1 && d > seg[i]) { d -= seg[i]; i++; }
    const t = seg[i] ? Math.min(1, d / seg[i]) : 0, x = lerp(pts[i][0], pts[i + 1][0], t), y = lerp(pts[i][1], pts[i + 1][1], t);
    const u = s / n, rr = lerp(w0, w1, u) / 2;
    for (let yy = Math.floor(y - rr); yy <= Math.ceil(y + rr); yy++) for (let xx = Math.floor(x - rr); xx <= Math.ceil(x + rr); xx++) {
      const dx = xx + 0.5 - x, dy = yy + 0.5 - y;
      if (dx * dx + dy * dy <= rr * rr + 0.3) P(fn(u, dx / Math.max(rr, 0.5), xx, yy), xx, yy);
    }
  }
}
function legSide(P, hx, hy, gy, p, near, pal, idle, w, fetlock){
  const sw = idle ? 0 : Math.sin(2 * Math.PI * p), lift = idle ? 0 : Math.max(0, Math.cos(2 * Math.PI * p)) * 2.4;
  const fx = hx + sw * 3.4, fy = gy - lift, kx = (hx + fx) / 2 + lift * 0.9, ky = (hy + fy) / 2;
  const base = near ? pal.m : pal.d, edge = near ? pal.l : pal.m;
  strokeS(P, [[hx, hy], [kx, ky], [fx, fy - 2]], w, w - 0.6, (u, n) => n < -0.25 ? edge : base);
  const x0 = Math.round(fx - w / 2 + 0.3);
  if (fetlock) P(near ? pal.fet : pal.fetD, x0, Math.round(fy) - 4, w, 2);
  P(pal.hoof, x0, Math.round(fy) - 2, w, 2);

function animalBlocked(x, y){
  if (x < 14 || x > IW - 14 || y > IH - 4) return true;

  if (Math.abs(x - LOT.cx) < 66 && y < LOT.base + 16) return true;

}

function penRoam(x, y){ return x > PEN.x0 + 14 && x < PEN.x1 - 14 && y > PEN.y0 + 12 && y < PEN.y1 - 4; }    // where penned animals wander
function pathClear(x0, y0, x1, y1, blocked){

}

function followLeash(a, dt){

    const dx = her.x - a.x, dy = her.y - a.y;
    a.moving = her.moving; if (her.moving) { a.step += dt * a.k.cycle * 2.6; if (Math.hypot(dx, dy) > 0.01) faceAnimal(a, dx, dy); }
    a.x = her.x; a.y = her.y;

    return;
  }
  let tx = null, ty = null;
  const n = Math.max(0, leads.indexOf(a)), back = 30 + n * 22, keep = 22 + n * 20;   // a second animal walks behind the first
  const d = Math.hypot(her.x - a.x, her.y - a.y);

    if (acc > back) { tx = trail[i]; ty = trail[i + 1]; }

  if (tx === null && d > keep + 4) { tx = her.x + (a.x - her.x) / d * keep; ty = her.y + (a.y - her.y) / d * keep; }
  a.moving = false;

    const dx = tx - a.x, dy = ty - a.y, dd = Math.hypot(dx, dy);

function updateAnimals(dt){

    a.cool = Math.max(0, a.cool - dt);
    if (a.danceUntil && performance.now() < a.danceUntil) { a.moving = false; continue; }   // bopping along to the dance
    if (a.leashed) { followLeash(a, dt); continue; }
    if (a.carry && Math.hypot(her.x - a.x, her.y - a.y) < 10) { attachLeash(a, true); continue; }   // caught! it drops the item and gets the leash
    if (a.k.name === 'piglet' && !a.penned && !a.carry && !thiefNow && !ended) {   // the piglet goes for an item every 7 seconds
      if (!a.goal && a.cool <= 0) {
        let best = null, bd = 1e9;
        for (const i of ITEMS) if (!i.taken && !i.held && !animalBlocked(i.x, i.y)) { const d = Math.hypot(i.x - a.x, i.y - a.y); if (d < bd) { bd = d; best = i; } }

        else if (Math.hypot(a.goal.x - a.x, a.goal.y - a.y) < 6) { const g = a.goal; a.goal = null; steal(a, g); continue; }
        else { a.tx = a.goal.x; a.ty = a.goal.y + 1; a.wait = 0; }
      }
    }
    if (a.k.name !== 'piglet' && !a.penned && !a.carry && !thiefNow && a.cool <= 0 && !ended) {
      const it = ITEMS.find(i => !i.taken && !i.held && Math.hypot(i.x - a.x, i.y - a.y) < 11);
      if (it && Math.random() < dt * 0.9) { steal(a, it); continue; }
    }

      if (a.wait <= 0) pickTarget(a);

    }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    if (d < 1) { a.tx = null; a.wait = a.carry ? 0 : 1.5 + Math.random() * 5; continue; }
    const fast = a.carry ? 2.3 : 1;
    const st = Math.min(d, a.k.speed * fast * dt);

function face(ch, dx, dy){
  if (Math.abs(dx) > Math.abs(dy)) { ch.dir = 'side'; ch.flip = dx < 0; }
  else ch.dir = dy < 0 ? 'up' : 'down';
}
/* the pen fence can only be crossed at the gate, and the way there goes around the right side of the house */
function inPen(x, y){ return y < PEN.y1 + 1; }
function planPath(x0, y0, x1, y1){
  const a = inPen(x0, y0), b = inPen(x1, y1);
  if (a === b) return [{ x: x1, y: y1 }];
  const gx = PEN.gx, front = LOT.base + 14;
  const C1 = { x: gx, y: front }, G1 = { x: gx, y: PEN.y1 + 7 }, G2 = { x: gx - 12, y: PEN.y1 - 12 };
  const nearHouse = (x, y) => x < gx - 6 && y < front - 2;
  if (!a) {                                             // going in
    const out = [];
    if (nearHouse(x0, y0)) out.push({ x: x0, y: front });
    if (x0 < gx - 6 || y0 > front) out.push(C1);
    return out.concat([G1, G2, { x: x1, y: y1 }]);
  }
  const out = [G2, G1];                                 // coming out
  if (x1 < gx - 6 || y1 > front) out.push(C1);
  if (nearHouse(x1, y1)) out.push({ x: x1, y: front });
  out.push({ x: x1, y: y1 });

}
/* the pond: nobody walks in the water; paths go around it */
const inPond = (x, y, m = 3) => ((x - POND.x) / (POND.rx + m)) ** 2 + ((y - POND.y) / (POND.ry + m)) ** 2 < 1;

  const out = []; let px0 = x0, py0 = y0;
  for (const p of pts) {
    if (crossesPond(px0, py0, p.x, p.y)) {
      const cands = [[POND.x, POND.y - POND.ry - 9], [POND.x, POND.y + POND.ry + 9], [POND.x - POND.rx - 9, POND.y], [POND.x + POND.rx + 9, POND.y]]
        .filter(([cx, cy]) => cx > 5 && cx < IW - 5 && cy < IH - 2);
      let best = null, bl = 1e9;
      for (const [cx, cy] of cands) if (!crossesPond(px0, py0, cx, cy) && !crossesPond(cx, cy, p.x, p.y)) {
        const l = Math.hypot(cx - px0, cy - py0) + Math.hypot(p.x - cx, p.y - cy); if (l < bl) { bl = l; best = { x: cx, y: cy }; }
      }

        const l = Math.hypot(a[0] - px0, a[1] - py0) + Math.hypot(b[0] - a[0], b[1] - a[1]) + Math.hypot(p.x - b[0], p.y - b[1]);

}

const ZONE = [0.41, 0.59];
function startFishing(x, y){
  if (riding) dismount(true);

  const ang = Math.atan2(her.y - POND.y, (her.x - POND.x) * (POND.ry / POND.rx));

        puff(it.x, it.y - 4, 8, ['#fff6d6', '#ffd76a']);
        say("I got it!", him, 1100); setBanner();
        setTimeout(() => { if (her.carry) walkTo(LOT.cx + (her.x < LOT.cx ? -6 : 6), LOT.base + 16, build); }, 350);
      } else {
        say(needed() ? `Not yet... ${STAGES[stage].need} first` : "All done!", him, 1900);
      }
    });
    return;
  }
  walkTo(x, y);
}
function build(){
  if (!her.carry) { busy = false; setBanner(); return; }   // it was dropped on the way (a thief!)
  her.dir = 'up'; him.dir = 'up';
  const kind = her.carry; her.carry = null;
  stage++; revealK = 0; sfx('place');
  puff(LOT.cx, LOT.base - 10, 18, ['#f2e3c0', '#c9a26b', '#ffffff']);
  setTimeout(() => {
    say(STAGES[stage - 1].done, Math.random() < 0.5 ? her : him, 2000);
    heart((her.x + him.x) / 2, Math.min(her.y, him.y) - 28);
    busy = false; setBanner();
    if (stage === STAGES.length) setTimeout(finish, 1600);
  }, 700);
  void kind;
}
function finish(){
  if (riding) dismount(true);
  ended = true; endT = 0; setBanner();
  walkTo(LOT.cx + 6, LOT.base + 13, () => { her.dir = 'down'; });
  sfx('finale');
}

/* ============================================================
   Render loop
   ============================================================ */
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  updateChars(dt);
  updateAnimals(dt);
  updateTreats(dt);
  updateFishing(dt);
  if (dancing() && now > nextNote) {                 // music notes float up while they dance
    nextNote = now + 380;
    const who = Math.random() < 0.5 ? her : him;
    particles.push({ x: who.x + (Math.random() - 0.5) * 8, y: who.y - 26, vx: (Math.random() - 0.5) * 8, vy: -14, life: 1.3, t: 0, c: '#fff8e6', note: true });
  }
  if (!dancing() && danceUntil && danceUntil < now && danceUntil > now - 100) { her.dir = 'down'; him.dir = 'down'; }
  if (riding && her.moving && now > nextHoof) { nextHoof = now + 300; sfx('hoof'); }
  updateRhythm(now);
  if (revealK < 1) revealK = Math.min(1, revealK + dt / 0.7);
  if (ended) { endT += dt; night = clamp(endT / 3); if (endT > 3.4 && !endEl.classList.contains('show')) { endEl.classList.add('show'); heart((her.x + him.x) / 2, her.y - 26); } if (endT > 3.4 && Math.floor(endT * 1.2) !== Math.floor((endT - dt) * 1.2)) heart((her.x + him.x) / 2 + (Math.random() - 0.5) * 10, her.y - 26); }

  g.setTransform(2, 0, 0, 2, 0, 0); g.imageSmoothingEnabled = false;
  g.drawImage(bg, 0, 0, IW, IH);
  // depth-sorted things
  const things = [];
  TREES.forEach(t => things.push({ y: t.y, draw: () => drawTree(t) }));
  things.push({ y: LOT.base + 6, draw: () => drawHouse(stage, revealK, night > 0.5) });
  things.push({ y: PEN.y1, draw: drawPenFront });
  ITEMS.forEach(it => { if (!it.taken && !it.held) things.push({ y: it.y, draw: () => {
    const need = it.kind === needed() && !her.carry && !ended;
    if (need) {                                           // glow + bouncing arrow on the one we need
      const p = (Math.sin(now / 180) + 1) / 2;
      g.fillStyle = `rgba(255,240,170,${0.25 + 0.3 * p})`; g.fillRect(it.x - 8, it.y - 13, 16, 15);
      const ay = it.y - 22 - Math.round(p * 3);
      px('#ffd76a', it.x - 2, ay, 5, 1); px('#ffd76a', it.x - 1, ay + 1, 3, 1); px('#ffd76a', it.x, ay + 2, 1, 1);
    }
    ICON[it.kind](it.x, it.y);
  } }); });
  ANIMALS.forEach(a => things.push({ y: a.y, draw: () => drawAnimal(a) }));
  SURPRISES.forEach((sp, i) => things.push({ y: sp.kind === 'tree' ? sp.y + 5 : sp.y, draw: () => drawSurprise(sp, i, now) }));
  if (TREAT) things.push({ y: TREAT.y, draw: () => {
    const p = (Math.sin(now / 220) + 1) / 2, bob = Math.round(p);
    g.fillStyle = `rgba(255,240,170,${0.18 + 0.22 * p})`; g.fillRect(TREAT.x - 5, TREAT.y - 9, 10, 10);
    TREAT_ICON[TREAT.kind](TREAT.x, TREAT.y - bob);
  } });
  if (!riding) things.push({ y: her.y, draw: () => drawChar(her, 'her') });
  things.push({ y: him.y + 0.1, draw: () => drawChar(him, 'him') });
  things.sort((a, b) => a.y - b.y).forEach(t => t.draw());

  // chimney smoke once it exists
  if (stage >= 6) {
    const chx = LOT.cx + 19, top = LOT.base - 24 - 30;
    for (let i = 0; i < 4; i++) {
      const tt = ((now / 1000 + i * 0.6) % 2.4) / 2.4;
      g.fillStyle = `rgba(235,235,235,${0.55 * (1 - tt)})`;
      g.fillRect(Math.round(chx + Math.sin(tt * 6 + i) * 3), Math.round(top - tt * 22), 3, 3);
    }
  }
  // the leash: a sagging rope from her hand to the animal
  for (const ln of leads) if (!ln.friendly && ln.nx !== undefined) {
    const hx = her.x + (her.dir === 'side' ? (her.flip ? -5 : 5) : 5), hy = her.y - 8, ax = ln.nx, ay = ln.ny;
    const sag = 4 + Math.min(6, Math.hypot(ax - hx, ay - hy) * 0.08);
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, x = lerp(hx, ax, t), y = lerp(hy, ay, t) + Math.sin(t * Math.PI) * sag;
      g.fillStyle = '#6b4a2a'; g.fillRect(Math.round(x * 2) / 2, Math.round(y * 2) / 2 + 0.5, 0.5, 0.5);
      g.fillStyle = '#e0bd82'; g.fillRect(Math.round(x * 2) / 2, Math.round(y * 2) / 2, 0.5, 0.5);
    }
    px('#c4503f', Math.round(ax) - 1, Math.round(ay) - 1, 2, 2);         // little red collar clip
  }
  drawFishing(now);
  // particles + hearts
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt; p.vy += 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > p.life) { particles.splice(i, 1); continue; }
    g.globalAlpha = 1 - p.t / p.life;
    if (p.note) { p.vy = -14; px('#2a1d14', p.x - 1, p.y + 2, 3, 2); px('#ffd76a', p.x, p.y + 2, 2, 1); px('#2a1d14', p.x + 1, p.y - 3, 1, 5); px('#2a1d14', p.x + 2, p.y - 3, 2, 1); }
    else px(p.c, p.x, p.y, 2, 2);
    g.globalAlpha = 1;
  }
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.t += dt; if (h.t > 1.6) { hearts.splice(i, 1); continue; }
    const x = Math.round(h.x), y = Math.round(h.y - h.t * 14);
    g.globalAlpha = 1 - h.t / 1.6;
    px('#ff5d7a', x - 3, y, 3, 2); px('#ff5d7a', x + 1, y, 3, 2); px('#ff5d7a', x - 3, y + 2, 7, 2); px('#ff5d7a', x - 2, y + 4, 5, 1); px('#ff5d7a', x - 1, y + 5, 3, 1); px('#ff5d7a', x, y + 6, 1, 1);
    px('#ffd1dc', x - 2, y + 1, 1, 1);
    g.globalAlpha = 1;
  }
  // night falls at the end; windows and lamp glow
  if (night > 0) {
    g.fillStyle = `rgba(16,20,58,${0.62 * night})`; g.fillRect(0, 0, IW, IH);
    const glowAt = (x, y, r, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,214,110,${a})`); gr.addColorStop(1, 'rgba(255,214,110,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); };
    const x0 = LOT.cx - 54, b = LOT.base;
    for (const wx of [x0 + 15, x0 + 37, x0 + 71, x0 + 93]) glowAt(wx, b - 14, 14, 0.32 * night);
    glowAt(LOT.cx - 10, b - 13, 13, 0.45 * night); glowAt(LOT.cx + 10, b - 13, 13, 0.45 * night);
    if (stage >= 8) for (const ly of [b + 13, b + 25]) for (const sd of [-1, 1]) glowAt(Math.round(pathX(ly) + sd * 10.5) + 0.5, ly - 5.5, 7, 0.4 * night);
    for (let i = 0; i < 14; i++) {                          // fireflies
      const fx = (Math.sin(now / 1400 + i * 2.1) * 0.5 + 0.5) * IW, fy = IH * 0.45 + (Math.sin(now / 1100 + i * 1.3) * 0.5 + 0.5) * IH * 0.5;
      g.fillStyle = `rgba(255,240,140,${night * (0.4 + 0.6 * Math.max(0, Math.sin(now / 300 + i)))})`; g.fillRect(Math.round(fx), Math.round(fy), 1, 1);
    }
  }
  // scale up to the screen with crisp pixels
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lo, 0, 0, IW * 2, IH * 2, 0, 0, IW * SCALE * dpr, IH * SCALE * dpr);

  // speech bubble follows its speaker
  if (bubbleUntil && now > bubbleUntil) { bubble.style.opacity = 0; bubbleUntil = 0; }
  bubble.style.left = (bubbleWho.x * SCALE) + 'px';
  bubble.style.top = ((bubbleWho === her && riding ? her.rideTop - 3 : bubbleWho.y - 26 - (bubbleWho === him && her.carry ? 12 : 0)) * SCALE) + 'px';   // above anything he carries
}

/* ============================================================
   Setup, resize, input
   ============================================================ */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  IW = Math.max(150, Math.min(240, Math.round(W / 2.2)));       // pixel world width: chunky pixels on phones
  SCALE = W / IW;
  IH = Math.ceil(H / SCALE);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  lo.width = IW * 2; lo.height = IH * 2;       // sprites are drawn at 2x onto the finer meadow
  layout(); drawBackground(); if (!ANIMALS.length) initAnimals();
  if (!her.x) { her.x = LOT.cx + 6; her.y = IH * 0.8; him.x = LOT.cx - 10; him.y = IH * 0.8; }
}
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (window.innerWidth === W && Math.abs(window.innerHeight - H) < 2) return;   // nothing really changed
  if (riding) dismount(true);
  const fx = her.x / IW, fy = her.y / IH, gx = him.x / IW, gy = him.y / IH;
  const its = ITEMS.map(i => ({ taken: i.taken, fx: i.x / IW, fy: i.y / IH, held: ANIMALS.indexOf(i.held) }));
  const ans = ANIMALS.map(a => ({ fx: a.x / IW, fy: a.y / IH }));
  resize();
  her.x = fx * IW; her.y = fy * IH; him.x = gx * IW; him.y = gy * IH; trail = []; route = []; target = null; her.chase = null;
  ITEMS.forEach((it, i) => { it.taken = its[i].taken; it.x = Math.round(its[i].fx * IW); it.y = Math.round(its[i].fy * IH); it.held = null; });
  ANIMALS.forEach((a, i) => {
    a.x = ans[i].fx * IW; a.y = ans[i].fy * IH; a.tx = null; a.carry = null;
    if (a.penned && !penRoam(a.x, a.y)) { a.x = lerp(PEN.x0 + 16, PEN.x1 - 16, Math.random()); a.y = lerp(PEN.y0 + 14, PEN.y1 - 6, Math.random()); }
    if (!a.penned && !a.leashed) for (let n = 0; n < 300 && animalBlocked(a.x, a.y); n++) { a.x = Math.random() * IW; a.y = IH * (0.55 + Math.random() * 0.45); }
  });
  its.forEach((st, i) => { if (st.held >= 0) { ANIMALS[st.held].carry = ITEMS[i]; ITEMS[i].held = ANIMALS[st.held]; } });
  setBanner();
}, 150); });
resize();
setBanner();
setTimeout(() => say("Let's build our home!", her, 2200), 600);
setTimeout(() => { if (!leads.length && !ANIMALS.some(a => a.penned)) say("Tap an animal to bring it to the pen!", him, 2600); }, 6000);

cv.addEventListener('pointerdown', audioInit);
let swallowUp = false;
cv.addEventListener('pointerdown', () => { if (fishing.phase === 'meter') { hook(); swallowUp = true; } });
cv.addEventListener('pointerup', (e) => {
  if (swallowUp) { swallowUp = false; return; }
  const x = e.clientX / SCALE, y = e.clientY / SCALE;
  tapWorld(x, y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('again').addEventListener('click', () => {
  stage = 0; revealK = 1; ended = false; night = 0; busy = false; her.carry = null; her.treat = null; TREAT = null; treatTimer = 6;
  riding = null; leads = []; her.chase = null; target = null; route = []; onArrive = null;
  layout(); ANIMALS = []; initAnimals();             // fresh materials, and the animals back out in the meadow
  endEl.classList.remove('show'); setBanner();
  say("Let's do it again!", her, 1800);
});
document.getElementById('mute').addEventListener('click', (e) => {
  muted = !muted; e.currentTarget.classList.toggle('off', muted);
  if (master) master.gain.value = muted ? 0 : 1;
});
endEl.querySelector('h1').textContent = CONFIG.endTitle;
endEl.querySelector('p').innerHTML = CONFIG.endLine;
requestAnimationFrame(frame);
</script>
